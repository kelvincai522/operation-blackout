<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OPERATION BLACKOUT</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #05070a; color: #e8eef5;
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #view { display: block; width: 100vw; height: 100vh; }

  /* ---- boot / loading screen ---- */
  #boot {
    position: fixed; inset: 0; z-index: 500;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background:
      radial-gradient(120% 90% at 50% 0%, #14202c 0%, #080c11 55%, #04060a 100%);
    transition: opacity .55s ease, visibility .55s;
  }
  #boot.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #boot::after {
    /* film grain so even the menu does not look flat */
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .05;
    background-image: repeating-conic-gradient(#fff 0% 25%, #000 0% 50%);
    background-size: 3px 3px; mix-blend-mode: overlay;
  }
  .title {
    font-size: clamp(30px, 6.4vw, 76px); font-weight: 800; letter-spacing: .16em;
    margin: 0 0 6px; text-transform: uppercase;
    background: linear-gradient(180deg, #ffffff 10%, #8fa4b8 92%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 60px rgba(120,170,255,.14);
  }
  .subtitle {
    font-size: 12px; letter-spacing: .48em; text-transform: uppercase;
    color: #6d8398; margin: 0 0 46px; padding-left: .48em;
  }
  #boot-track {
    width: min(460px, 74vw); height: 2px; background: rgba(255,255,255,.09);
    overflow: hidden; border-radius: 2px;
  }
  #boot-bar {
    height: 100%; width: 0%; border-radius: 2px;
    background: linear-gradient(90deg, #3f7fbf, #7fd4ff);
    box-shadow: 0 0 14px rgba(110,200,255,.55); transition: width .28s ease;
  }
  #boot-status {
    margin-top: 14px; font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
    color: #5f748a; height: 15px;
  }
  #start-btn {
    margin-top: 34px; padding: 13px 42px; font: inherit; font-size: 13px;
    letter-spacing: .26em; text-transform: uppercase; cursor: pointer;
    color: #cfe4f7; background: rgba(80,140,200,.10);
    border: 1px solid rgba(140,190,240,.42); border-radius: 2px;
    opacity: 0; transform: translateY(8px); pointer-events: none;
    transition: opacity .4s ease, transform .4s ease, background .2s, border-color .2s;
  }
  #boot.ready #start-btn { opacity: 1; transform: none; pointer-events: auto; }
  #start-btn:hover { background: rgba(110,180,240,.22); border-color: rgba(180,220,255,.75); }
  #boot.ready #boot-track, #boot.ready #boot-status { opacity: .35; }
  .hint {
    position: absolute; bottom: 28px; font-size: 11px; letter-spacing: .16em;
    color: #4d6076; text-transform: uppercase;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="boot">
  <h1 class="title">Operation Blackout</h1>
  <p class="subtitle">Tactical Response</p>
  <div id="boot-track"><div id="boot-bar"></div></div>
  <div id="boot-status">Initialising…</div>
  <button id="start-btn">Deploy</button>
  <div class="hint">WASD move &nbsp;·&nbsp; Shift sprint &nbsp;·&nbsp; C crouch &nbsp;·&nbsp; RMB aim &nbsp;·&nbsp; R reload</div>
</div>

<!-- three.js r180, converted to a classic script by tools/build_three_global.py
     so the whole game runs from file:// with no bundler and no server. -->
<script src="vendor/three.global.js"></script>

<!-- foundation -->
<script src="src/core/util.js"></script>

<!-- rendering -->
<script src="src/render/textures.js"></script>
<script src="src/render/materials.js"></script>
<script src="src/render/sky.js"></script>
<script src="src/render/lighting.js"></script>
<script src="src/render/postfx.js"></script>

<!-- world: one Level+Props pair per level, selected at boot via ?level=<id>.
     See the LEVELS registry in src/game/main.js. -->
<script src="src/world/level.js"></script>
<script src="src/world/props.js"></script>
<script src="src/world/level_harbor.js"></script>
<script src="src/world/props_harbor.js"></script>
<script src="src/world/level_snowbound.js"></script>
<script src="src/world/props_snowbound.js"></script>
<script src="src/world/level_metro.js"></script>
<script src="src/world/props_metro.js"></script>
<script src="src/world/level_highrise.js"></script>
<script src="src/world/props_highrise.js"></script>
<script src="src/world/level_boneyard.js"></script>
<script src="src/world/props_boneyard.js"></script>
<script src="src/world/level_bunker.js"></script>
<script src="src/world/props_bunker.js"></script>
<script src="src/world/level_jungle.js"></script>
<script src="src/world/props_jungle.js"></script>
<script src="src/world/level_refinery.js"></script>
<script src="src/world/props_refinery.js"></script>
<script src="src/world/level_ruins.js"></script>
<script src="src/world/props_ruins.js"></script>

<!-- gameplay -->
<script src="src/player/controller.js"></script>
<script src="src/weapons/weapons.js"></script>
<script src="src/weapons/ballistics.js"></script>
<script src="src/fx/vfx.js"></script>
<script src="src/fx/weather.js"></script>
<script src="src/audio/audio.js"></script>
<script src="src/ai/ai.js"></script>
<script src="src/ui/hud.js"></script>

<!-- integration -->
<script src="src/game/scenarios.js"></script>
<script src="src/game/main.js"></script>
<script>
(function () {
  var out = { phase: 'init', level: null, errors: [], frames: 0, warnings: [] };
  window.__PLAYTEST__ = out;
  window.addEventListener('error', function (e) {
    out.errors.push('window: ' + (e.message || e.error));
  });

  function key(code, down) {
    window.dispatchEvent(new KeyboardEvent(down ? 'keydown' : 'keyup',
      { code: code, bubbles: true }));
  }
  function mouse(type, button) {
    window.dispatchEvent(new MouseEvent(type, { button: button || 0, bubbles: true }));
  }
  function move(dx, dy) {
    var e = new MouseEvent('mousemove', { bubbles: true });
    Object.defineProperty(e, 'movementX', { value: dx });
    Object.defineProperty(e, 'movementY', { value: dy });
    window.dispatchEvent(e);
  }

  var t0 = Date.now();
  var waited = 0;
  var iv = setInterval(function () {
    waited += 100;
    var G = window.GAME;
    if (!G || !G.engine || !G.engine.ctx) {
      if (waited > 90000) { clearInterval(iv); out.phase = 'never-booted'; finish(); }
      return;
    }
    var ctx = G.engine.ctx;
    // Record which level actually loaded as soon as it is known: main.js falls
    // back to market when a level module is missing, and a silent fallback would
    // otherwise look like a passing run of the level that was asked for.
    if (ctx.levelId) out.level = ctx.levelId;
    if (!G.engine.running) {
      if (waited > 90000) { clearInterval(iv); out.phase = 'booted-but-not-running'; finish(); }
      return;
    }
    clearInterval(iv);
    out.phase = 'running';
    out.built = G.engine.built || [];
    play(ctx);
  }, 100);

  function play(ctx) {
    // The real game gates input on pointer lock; fake it being granted.
    ctx.input.locked = true;
    var p = ctx.player;
    var spawn = p ? [p.position.x, p.position.y, p.position.z] : [0, 0, 0];

    // Headless Chrome barely services requestAnimationFrame, so pumping the
    // engine directly is the only way to exercise real gameplay. This still
    // goes through the true interactive path: input -> controller -> systems.
    var DT = 1 / 60, N = 600;                 // 10 seconds of play
    var at = {                                 // frame -> input action
      12:  function () { key('KeyW', true); },
      60:  function () { move(60, 8); },
      90:  function () { key('ShiftLeft', true); },              // sprint
      150: function () { key('ShiftLeft', false); move(-40, -6); },
      170: function () { mouse('mousedown', 2); },               // ADS
      210: function () { mouse('mousedown', 0); },               // fire
      265: function () { mouse('mouseup', 0); mouse('mouseup', 2); },
      285: function () { key('KeyR', true); },                   // reload
      290: function () { key('KeyR', false); },
      360: function () { key('KeyC', true); },                   // crouch
      400: function () { key('KeyC', false); key('Space', true); },
      406: function () { key('Space', false); key('KeyA', true); },
      460: function () { key('KeyA', false); },
      560: function () { key('KeyW', false); },
    };

    var states = {}, maxSpeed = 0, fired = false, minAmmo = 99, firstAmmo = null;
    var minHealth = p ? p.health : -1;
    var t = 0;
    for (var i = 0; i < N; i++) {
      if (at[i]) { try { at[i](); } catch (e) { out.errors.push('input@' + i + ': ' + e); } }
      try {
        ctx.engine.step(DT);
        ctx.engine.render();
      } catch (e) {
        out.errors.push('frame ' + i + ': ' + (e && e.stack || e));
        break;
      }
      t += DT;
      if (p) {
        states[p.state] = (states[p.state] || 0) + 1;
        var sp = Math.hypot(p.velocity.x, p.velocity.z);
        if (sp > maxSpeed) maxSpeed = sp;
        if (p.health < minHealth) minHealth = p.health;
      }
      var w = ctx.weapons && ctx.weapons.current;
      if (w) {
        // Compare against the ammo the session STARTED with. Testing a literal
        // "< 30" assumed one weapon's magazine size and would read as 'fired'
        // for any weapon that simply carries fewer rounds than that.
        if (firstAmmo === null) { firstAmmo = w.ammo; minAmmo = w.ammo; }
        if (w.ammo < minAmmo) minAmmo = w.ammo;
        if (w.ammo < firstAmmo) fired = true;
      }
      out.frames = i + 1;
    }

    out.simSeconds = r(t);
    out.statesSeen = states;
    out.maxSpeed = r(maxSpeed);
    out.didFire = fired;
    out.minAmmo = minAmmo;
    out.minHealth = minHealth;
    out.died = !!(p && minHealth <= 0);
    out.player = p ? {
      pos: [r(p.position.x), r(p.position.y), r(p.position.z)],
      state: p.state, health: p.health,
      moved: r(Math.hypot(p.position.x - spawn[0], p.position.z - spawn[2])),
    } : null;
    out.weapon = ctx.weapons && ctx.weapons.current ? {
      name: ctx.weapons.current.name,
      ammo: ctx.weapons.current.ammo,
      reserve: ctx.weapons.current.reserve,
    } : null;
    out.enemies = ctx.ai && ctx.ai.enemies ? ctx.ai.enemies.length : -1;
    out.drawCalls = ctx.renderer.info.render.calls;
    out.triangles = ctx.renderer.info.render.triangles;
    out.elapsedMs = Date.now() - t0;
    finish();
  }

  function r(v) { return Math.round(v * 100) / 100; }
  function trim(a, n, len) {
    if (!a) return a;
    return a.slice(0, n).map(function (e) { return String(e).slice(0, len); });
  }
  function enc(o) { try { return JSON.stringify(o); } catch (e) { return '{"phase":"unencodable"}'; } }

  function finish() {
    // Always surface engine-side errors, including on the failure paths -
    // "it never started" is useless without knowing what threw.
    if (window.GAME && window.GAME.errors && !out.gameErrors) {
      out.gameErrors = window.GAME.errors.slice(0, 25);
    }
    out.errorCount = out.errors.length;
    out.gameErrorCount = (out.gameErrors || []).length;

    // The title has to stay VALID JSON. It used to be hard-sliced at 1800
    // chars, which cut mid-string on exactly the runs that reported errors -
    // so the levels whose diagnostics mattered most parsed as PARTIAL and
    // printed nothing. Shed detail instead of truncating the encoding.
    var s = enc(out);
    if (s.length > 2600) {
      out.errors = trim(out.errors, 8, 180);
      out.gameErrors = trim(out.gameErrors, 8, 180);
      out.truncated = true;
      s = enc(out);
    }
    if (s.length > 2600) {
      out.errors = trim(out.errors, 2, 120);
      out.gameErrors = trim(out.gameErrors, 2, 120);
      s = enc(out);
    }
    document.title = 'PLAYTEST ' + s;
  }
})();
</script>
</body>
</html>
